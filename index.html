<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A6B4F">
  <meta name="description" content="PocketTrack: your money, your control.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PocketTrack">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PocketTrack</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/transactions.css">
  <link rel="stylesheet" href="css/budgets.css">
  <link rel="stylesheet" href="css/savings.css">
  <link rel="stylesheet" href="css/analytics.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="view" id="view" tabindex="-1"></div>
    </main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>

    <button class="fab" id="fab" type="button" aria-label="Add transaction">
      <span class="fab-icon" id="fab-icon"></span>
      <span class="fab-label">Add transaction</span>
    </button>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/savings.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/transactions.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/budgets.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/add-form.js"></script>

  <script>
    // Register the service worker (only works on https or localhost)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service worker not registered:', err);
        });
      });
    }
  </script>
</body>
</html>
